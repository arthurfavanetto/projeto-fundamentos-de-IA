[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rbac-ai-assistant"
version = "0.1.0"
description = "Assistente normativo de IA especializado em Regulamentos Brasileiros da Aviação Civil (RBAC — ANAC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "google-genai>=3.0.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pdfplumber>=0.11.5,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-telegram-bot>=21.10,<23.0",
    "pyyaml>=6.0.2,<7.0.0",
    "structlog>=25.1.0,<26.0.0",
    "tenacity>=9.0.0,<10.0.0",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=4.30.0,<6.0.0",
    "pytesseract>=0.3.13,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "reportlab>=4.3.0,<5.0.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.12.20241230",
]

[project.scripts]
rbac-assistant = "rbac_assistant.main:main"
rbac-healthcheck = "rbac_assistant.healthcheck:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rbac_assistant"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF001", # caracteres portugueses legítimos (ex.: travessão, aspas tipográficas)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["rbac_assistant", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rbac_assistant"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "chromadb",
    "chromadb.*",
    "pdfplumber",
    "pdfplumber.*",
    "pypdfium2",
    "pypdfium2.*",
    "pytesseract",
    "pytesseract.*",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: testes unitários isolados sem dependências externas",
    "integration: testes de integração entre módulos ou serviços",
]
