# ==============================================================================
# RBAC AI Assistant — Configurações Operacionais Não-Sensíveis
# ==============================================================================
# Nenhuma credencial, token ou Telegram User ID deve ser inserido neste arquivo.

app:
  name: "rbac-ai-assistant"
  domain: "Regulamentação Aeronáutica Brasileira (ANAC)"
  default_language: "pt-BR"

storage:
  documents_dir: "/app/data/documents"
  sqlite_filename: "catalog.sqlite3"
  raw_pdfs_subdir: "raw_pdfs"
  extracted_subdir: "extracted"
  reviews_subdir: "reviews"
  audit_logs_dir: "/app/logs"
  sqlite_busy_timeout_ms: 5000

extraction:
  # Extração nativa prioritária via pdfplumber (MIT); OCR opcional e desacoplado
  min_native_chars_per_page: 50
  ocr_language: "por"
  # Política OCR preservada: páginas OCR ficam bloqueadas até revisão manual
  ocr_unreviewed_policy: "block_until_reviewed"
  # Política híbrida de validação: strict_all_pages | review_on_demand | native_auto_ocr_manual
  validation_policy: "review_on_demand"
  require_integrity_check_for_native_pages: true
  max_pdf_size_mb: 50
  max_pdf_pages: 1000
  extraction_version: "2.0.0"

vector_db:
  provider: "chromadb"
  pinned_version: "1.5.9"
  heartbeat_path: "/api/v2/heartbeat"
  request_timeout_seconds: 5.0
  # Coleção versionada dedicada ao Gemini Embedding 2 (768d, estratégia assimétrica v1)
  collection_name: "regulatory_chunks_ge2_768_v1"
  test_collection_prefix: "test_"

gemini:
  timeout_seconds: 30.0
  max_retries: 3
  retry_min_wait_seconds: 0.5
  retry_max_wait_seconds: 8.0
  temperature: 0.1
  max_output_tokens: 2048
  # Política única de embeddings (Free Tier Standard textual; 768d obrigatório; limite 8.192 tokens)
  embedding_dimensions: 768
  embedding_instruction_version: "ge2_asymmetric_v1"
  embedding_max_input_tokens: 8192
  embedding_batch_size: 32
  prompts_dir: "config/prompts"
  # Política única de modelos em runtime (Free Tier Standard, sem fallback silencioso)
  allowed_free_tier_generation_models:
    - "gemini-4-hydrogen"
  allowed_free_tier_embedding_models:
    - "gemini-embedding-2"

chunking:
  # Preserva seções completas dentro da janela alvo (folga ampla abaixo dos 8.192 tokens do GE2)
  max_chunk_tokens: 1200
  overlap_tokens: 0
  preserve_hierarchy: true

retrieval:
  semantic_top_k: 5
  lexical_top_k: 5
  final_top_k: 5
  rrf_k: 60
  # Threshold inicial/provisório para distância de cosseno no ChromaDB (`hnsw:space: cosine`).
  # Deverá ser calibrado com benchmark real após ingestão do PDF oficial do RBAC 43.
  max_vector_distance: 0.85
  only_current_amendment_by_default: true
  reconstruct_full_section_from_ssot: true
  allow_preliminary_native_search: true

telegram:
  mode: "long_polling"
  max_message_length: 4096
  max_input_length: 1000
  polling_timeout_seconds: 30
  max_concurrent_updates_per_user: 1
  duplicate_update_cache_size: 512
  startup_retry_max_attempts: 5
  startup_retry_base_delay_seconds: 2.0

security:
  deny_by_default: true
  rate_limit:
    requests_per_minute: 15
    burst_size: 5
  audit:
    # Auditoria persistente em JSONL no volume /app/logs (independente da rotação json-file do Docker)
    pseudonymize_user_ids: false
    redact_secrets: true
    filename: "audit_events.jsonl"
    max_file_size_mb: 10
    max_rotated_files: 10
    max_detail_string_length: 300
